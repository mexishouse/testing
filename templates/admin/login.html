{% extends "public_base.html" %}
{% block title %}Admin Login - CyberAttend{% endblock %}
{% block content %}
<h1>Admin sign in</h1>
<p class="sub">Authorised administrators only</p>
<form method="POST" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label>Username</label><input type="text" name="username" required autofocus></div>
    <div class="field"><label>Password</label><input type="password" name="password" required></div>
    <button class="btn" type="submit">Sign in</button>
</form>
<div class="links"><a href="{{ url_for('login') }}">← Employee login</a></div>
{% endblock %}
